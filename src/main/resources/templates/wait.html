<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <title>待機中</title>
</head>

<body>
  <h1>相手の手を待ってます</h1>
  <p>Hi [[${login_user}]]</p>

  <div th:if="${match}">
    <h2>結果</h2>
    <p>Match: id [[${match.id}]] user1: [[${match.user1}]] user2: [[${match.user2}]] user1Hand: [[${match.user1Hand}]]
      user2Hand: [[${match.user2Hand}]]</p>
    <a href="/janken">もどる</a>
  </div>

  <div id="result"></div>

  <script th:unless="${match}">
    window.onload = function () {
      const sse = new EventSource('/result');
      sse.onmessage = function (event) {
        sse.close();
        const matches = JSON.parse(event.data);
        const area = document.getElementById('result');

        const h2 = document.createElement('h2');
        h2.textContent = '結果';
        area.appendChild(h2);

        for (const m of matches) {
          const p = document.createElement('p');
          p.textContent = `Match: id ${m.id} user1: ${m.user1} user2: ${m.user2} user1Hand: ${m.user1Hand} user2Hand: ${m.user2Hand}`;
          area.appendChild(p);
        }

        const back = document.createElement('a');
        back.href = '/janken';
        back.textContent = 'もどる';
        area.appendChild(back);
      };
    };
  </script>
</body>

</html>
