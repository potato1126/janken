<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.springframework.org/schema/security">

<head>
  <meta charset="utf-8">
  <title>janken</title>
</head>

<body>
  <a href="/logout">ログアウト</a>
  <h1>Janken GAME!</h1>
  <div th:if="${entry}">
    <p>エントリー</p>
    <ul>
      <li th:each="user : ${users}"><a th:href="@{/match(id=${user.id})}"> [[${user.name}]]</a></li>
    </ul>
    <p>Hi [[${entry.users}]]</p>
  </div>

  <h2>試合結果</h2>
  <ul>
    <li th:each="match : ${matches}">
      id:[[${match.id}]] user1:[[${match.user1}]] user2:[[${match.user2}]]
      user1の手:[[${match.user1Hand}]] user2の手:[[${match.user2Hand}]]
    </li>
  </ul>
</body>

</html>
